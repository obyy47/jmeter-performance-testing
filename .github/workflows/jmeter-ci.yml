name: JMeter Performance Testing CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (Required for JMeter)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apache JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q apache-jmeter-5.6.3.zip
          sudo mv apache-jmeter-5.6.3 /opt/jmeter
          echo "/opt/jmeter/bin" >> $GITHUB_PATH

      - name: Run Smoke & Data-Driven Tests
        run: |
          mkdir -p reports
          jmeter -n -t test-plans/smoke-test.jmx -l reports/smoke-results.jtl -e -o reports/smoke-html
          jmeter -n -t test-plans/data-driven-test.jmx -l reports/data-driven-results.jtl -e -o reports/data-driven-html

      - name: Upload HTML & JTL Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-reports
          path: reports/